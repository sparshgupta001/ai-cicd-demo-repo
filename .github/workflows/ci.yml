name: CI Pipeline

on:
  push:
    branches:
      - main
      - demo-intentional-failure

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          pytest 2>&1 | tee ci_output.log

      - name: Upload CI Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci_output.log

      - name: Notify AI Diagnosis Backend
        if: failure()
        env:
          CI_ORCHESTRATOR_WEBHOOK_URL: ${{ secrets.CI_ORCHESTRATOR_WEBHOOK_URL }}
        run: |
          if [ -z "$CI_ORCHESTRATOR_WEBHOOK_URL" ]; then
            echo "::error::Set the CI_ORCHESTRATOR_WEBHOOK_URL repository secret to your public backend URL."
            exit 1
          fi

          payload=$(jq -n \
            --arg source "github" \
            --arg repo "${{ github.repository }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg ref "${{ github.ref_name }}" \
            '{source: $source, repo: $repo, run_id: $run_id, ref: $ref}')

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -X POST "${CI_ORCHESTRATOR_WEBHOOK_URL%/}/api/webhook" \
            -H "ngrok-skip-browser-warning: true" \
            -H "Content-Type: application/json" \
            -d "$payload"