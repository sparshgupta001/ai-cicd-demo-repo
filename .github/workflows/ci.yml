name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest 2>&1 | tee ci_output.log

      - name: Upload CI Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci_output.log

      - name: Notify AI Diagnosis Backend
        if: failure()
        run: |
          LOG_CONTENT=$(cat ci_output.log | sed 's/"/\\"/g')

          curl -X POST https://4532-45-112-138-10.ngrok-free.app/api/webhook \
            -H "Content-Type: application/json" \
            -d "{
              \"source\": \"github\",
              \"repo\": \"${{ github.repository }}\",
              \"run_id\": \"${{ github.run_id }}\",
              \"ref\": \"${{ github.ref_name }}\",
              \"log\": \"$LOG_CONTENT\"
            }"